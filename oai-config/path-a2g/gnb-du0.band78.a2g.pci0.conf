rfsimulator =({
  # A2G: Path B roles — DU is RFsim CLIENT (UE is server). Avoids nbAnt assert.
  serveraddr = "127.0.0.1";
  serverport = 4043;
  # AWGN first demo. TR 38.876 section 6.2.5.6 ATG BS-UE LOS/FSPL is not an OAI channel type here
  options = ();
  # No extra RFsim delay — DERIVED from TR 38.876 Table 6.2.1.3-1
  modelname = "AWGN";
  IQfile = "/tmp/rfsimulator.iqs";
});

